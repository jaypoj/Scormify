name: Apply Universal Gate Fix

on:
  push:
    branches:
      - fix/retake-and-legacy-universal
    paths:
      - '.github/workflows/apply-universal-gate-validator-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retake-and-legacy-universal
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python tools/apply_universal_gate_fix.py
      - name: Verify
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bunx tsx test-retake-threshold.ts
          bunx tsx test-universal-pass-preservation.ts
          bunx tsx test-cross-profile-integrity.ts
          bunx tsx test-batch-regression.ts
          bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/universalPassPreservation.ts test-batch-regression.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: recognize Universal explicit retake helper gate"
          git push origin HEAD:fix/retake-and-legacy-universal
