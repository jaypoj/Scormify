name: Apply Failed Quiz Resume Fix V2

on:
  push:
    branches:
      - fix/retake-and-legacy-universal
    paths:
      - tools/fix_failed_quiz_resume_v2.py
      - .github/workflows/apply-failed-quiz-resume-fix-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/retake-and-legacy-universal

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply targeted source patch
        run: |
          python tools/apply_failed_quiz_resume_fix.py
          python tools/fix_failed_quiz_resume_v2.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify full regression contract
        run: |
          bun run lint
          bun run test
          bunx tsx test-retake-threshold.ts
          bunx tsx test-universal-pass-preservation.ts
          bunx tsx test-cross-profile-integrity.ts
          bunx tsx test-batch-regression.ts
          bun run build

      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/codeTransformer.ts src/utils/issue1StatefulRuntime.ts src/utils/crossProfileWorkdayHardening.ts test-retake-threshold.ts test-cross-profile-integrity.ts README.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: resume failed learners at final assessment"
          git push origin HEAD:fix/retake-and-legacy-universal
