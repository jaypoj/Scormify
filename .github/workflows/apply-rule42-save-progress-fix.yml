name: Apply Rule 42 Save Progress Fix

on:
  push:
    branches:
      - fix/retake-and-legacy-universal
    paths:
      - tools/apply_rule42_save_progress_fix.py
      - .github/workflows/apply-rule42-save-progress-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/retake-and-legacy-universal

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply targeted validator fix
        run: python tools/apply_rule42_save_progress_fix.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify full regression contract
        run: |
          bun run lint
          bun run test
          bunx tsx test-retake-threshold.ts
          bunx tsx test-universal-pass-preservation.ts
          bunx tsx test-cross-profile-integrity.ts
          bunx tsx test-batch-regression.ts
          bun run build

      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/issue1StatefulRuntime.ts test-issue1.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: recognize clamped save-only progress in Rule 42"
          git push origin HEAD:fix/retake-and-legacy-universal
