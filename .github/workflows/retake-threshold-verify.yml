name: Retake and Threshold Verification

on:
  push:
    branches:
      - fix/retake-and-legacy-universal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply retake feedback reset
        run: node scripts/apply-retake-feedback-reset.mjs

      - name: Apply threshold validator update
        run: node scripts/apply-validator-threshold.mjs

      - name: Type check
        run: bun run lint

      - name: Existing regression suites
        run: bun run test

      - name: New regression suite
        run: bunx tsx test-retake-threshold.ts

      - name: Build
        run: bun run build

      - name: Upload tested source
        uses: actions/upload-artifact@v4
        with:
          name: tested-retake-threshold-source
          path: |
            src/utils/codeTransformer.ts
            src/utils/validator.ts
          if-no-files-found: error
