name: Retake and Threshold Apply

on:
  push:
    branches:
      - fix/retake-and-legacy-universal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/retake-and-legacy-universal
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply retake feedback reset
        run: node scripts/apply-retake-feedback-reset.mjs

      - name: Apply threshold validator update
        run: node scripts/apply-validator-threshold.mjs

      - name: Type check
        run: bun run lint

      - name: Existing regression suites
        run: bun run test

      - name: Retake and threshold regression suite
        run: bunx tsx test-retake-threshold.ts

      - name: Build
        run: bun run build

      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/codeTransformer.ts src/utils/validator.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: clear retake feedback and resolve indirect pass thresholds"
          git push origin HEAD:fix/retake-and-legacy-universal
