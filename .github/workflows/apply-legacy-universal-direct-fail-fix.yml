name: Apply Legacy Universal Direct-Fail Compatibility Patch

on:
  push:
    branches:
      - fix/retake-and-legacy-universal
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: legacy-universal-direct-fail-fix
  cancel-in-progress: false

jobs:
  patch-test-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/retake-and-legacy-universal

      - name: Apply focused compatibility patch
        run: python tools/apply_legacy_universal_direct_fail_fix.py

      - name: Show focused diff
        run: git diff -- src/utils/universalPassPreservation.ts test-universal-pass-preservation.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Existing regression suites
        run: bun run test

      - name: Retake and threshold regression suite
        run: bunx tsx test-retake-threshold.ts

      - name: Universal pass-preservation regression
        run: bunx tsx test-universal-pass-preservation.ts

      - name: Cross-profile Workday integrity regression
        run: bunx tsx test-cross-profile-integrity.ts

      - name: Canonical Save & Exit runtime regression
        run: bunx tsx test-exit-runtime.ts

      - name: Mixed-era batch regression suite
        run: bunx tsx test-batch-regression.ts

      - name: Build
        run: bun run build

      - name: Verify Pages build output
        run: |
          test -f dist/index.html
          grep -q '/Scormify/' dist/index.html

      - name: Remove temporary helper before commit
        run: rm tools/apply_legacy_universal_direct_fail_fix.py

      - name: Commit verified compatibility changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-legacy-universal-direct-fail-fix.yml
          git commit -m "fix: support legacy Universal direct failed status writes"
          git push origin HEAD:fix/retake-and-legacy-universal

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
