name: Deploy Retake and Threshold Preview to GitHub Pages

on:
  push:
    branches:
      - fix/retake-and-legacy-universal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Existing regression suites
        run: bun run test

      - name: Retake and threshold regression suite
        run: bunx tsx test-retake-threshold.ts

      - name: Universal pass-preservation regression
        run: bunx tsx test-universal-pass-preservation.ts

      - name: Cross-profile Workday integrity regression
        run: bunx tsx test-cross-profile-integrity.ts

      - name: Canonical Save & Exit runtime regression
        run: bunx tsx test-exit-runtime.ts

      - name: Mixed-era batch regression suite
        run: bunx tsx test-batch-regression.ts

      - name: Build
        run: bun run build

      - name: Verify Pages build output
        run: |
          test -f dist/index.html
          grep -q '/Scormify/' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
