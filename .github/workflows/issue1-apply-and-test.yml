name: Issue 1 Apply and Test

on:
  push:
    branches:
      - fix/stateful-runtime-issue-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/stateful-runtime-issue-1
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Issue 1 source patch
        run: node scripts/apply-issue1-source-patch.mjs

      - name: Instrument syntax stage diagnostics
        run: node scripts/instrument-issue1-debug.mjs

      - name: Type check
        run: bun run lint

      - name: Run full tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Show source diff
        run: git diff -- src/utils/codeTransformer.ts src/utils/patcher.ts src/utils/validator.ts src/utils/packageProcessor.ts

      - name: Commit tested implementation
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/codeTransformer.ts src/utils/patcher.ts src/utils/validator.ts src/utils/packageProcessor.ts
          git commit -m "fix: implement Issue 1 stateful runtime safeguards"
          git push origin HEAD:fix/stateful-runtime-issue-1
